# Local Jenkins for running the pipeline:
#   cd jenkins && docker compose up -d --build
#   open http://localhost:8081  (initial password: docker compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword)
services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Build images with the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    # Group that owns /var/run/docker.sock on the host. Docker Desktop uses root (0);
    # on Linux use: DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d
    group_add:
      - "${DOCKER_GID:-0}"

volumes:
  jenkins_home:
